<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found – PGlove</title>
    <meta name="robots" content="noindex, follow">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #0A0A0A;
            color: #E5E7EB;
            font-family: 'Inter', -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            padding: 20px;
        }
        .container { max-width: 600px; }
        .error-code { font-size: 8rem; font-weight: 800; color: #FF4500; line-height: 1; }
        h1 { font-size: 2rem; margin: 20px 0 10px; }
        p { color: #9CA3AF; margin-bottom: 30px; }
        .btn {
            display: inline-block;
            background: #FF4500;
            color: #0A0A0A;
            font-weight: 600;
            padding: 14px 36px;
            border-radius: 50px;
            text-decoration: none;
            transition: all 0.3s;
        }
        .btn:hover { background: #FFD700; transform: scale(1.02); }
        .emoji { font-size: 3rem; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="error-code">404</div>
        <span class="emoji">🧤</span>
        <h1>Page Not Found</h1>
        <p>Oops! The page you're looking for doesn't exist. It might have been moved or deleted.</p>
        <a href="/" class="btn">🏠 Go to PGlove Home</a>
        <p style="margin-top: 20px; font-size: 0.8rem; color: #6B7280;">
            PGlove – A Browser With A New Generation
        </p>
    </div>
</body>
</html>
