name: PR Mergeability Check

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  check-mergeable:
    runs-on: ubuntu-latest
    steps:
      - name: Check PR mergeability
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const { data: prData } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });

            console.log(`Mergeable status: ${prData.mergeable}`);

            if (prData.mergeable === false) {
              core.setFailed('❌ This PR has merge conflicts. Please resolve them before pushing.');
            } else if (prData.mergeable === null) {
              console.log('⏳ GitHub is still calculating mergeability. Skipping check.');
            } else {
              console.log('✅ PR is mergeable.');
            }
